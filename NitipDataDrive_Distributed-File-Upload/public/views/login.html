<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Nitip Data Drive</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/login.css">
  <link rel="icon" type="image/png" href="../asset/Logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

<button id="themeToggle" class="btn btn-secondary" style="position: fixed; top: 24px; right: 24px; border-radius: 50%; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 1000; box-shadow: var(--shadow-md);">
  <i class="fa-solid fa-moon"></i>
</button>

<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img src="../asset/Logo.png" alt="Logo" style="width: 80px; height: 80px; margin-bottom: 16px; border-radius: 50%; object-fit: cover; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 255, 255, 0.2);">
      <h1>Nitip Data Drive</h1>
      <p>Sistem Penyimpanan Berkas Terdistribusi</p>
    </div>

    <div id="alert" class="alert"></div>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" class="form-control" placeholder="Masukkan username" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Masukkan password" autocomplete="current-password">
    </div>

    <button class="btn btn-primary btn-block" id="btnLogin" style="margin-top: 8px;">
      Masuk
    </button>

    <div style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--text-muted);">
      Belum punya akun? 
      <a href="#" id="linkRegister" style="color: var(--primary); font-weight: 600; text-decoration: none; transition: color 0.2s;">Daftar di sini</a>
    </div>

    <!-- Panel Registrasi -->
    <div id="registerPanel" style="display:none; margin-top:24px; padding-top:24px; border-top:1px solid var(--border-light);">
      <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; text-align: center;">Buat Akun Baru</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-bottom: 16px;">
        Akun akan disetujui oleh admin sebelum bisa login.
      </p>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" class="form-control" placeholder="email@domain.com">
      </div>
      <div class="form-group">
        <label for="regUsername">Username</label>
        <input type="text" id="regUsername" class="form-control" placeholder="Min. 3 karakter">
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 karakter">
      </div>
      <button class="btn btn-success btn-block" id="btnRegister">
        Daftar Sekarang
      </button>
    </div>
  </div>
</div>

<script>
const alertBox      = document.getElementById('alert');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const btnLogin      = document.getElementById('btnLogin');
const linkRegister  = document.getElementById('linkRegister');
const registerPanel = document.getElementById('registerPanel');

function showAlert(message, type = 'error') {
  alertBox.textContent  = message;
  alertBox.className    = `alert alert-${type} show`;
}

function hideAlert() {
  alertBox.className = 'alert';
}

linkRegister.addEventListener('click', (e) => {
  e.preventDefault();
  hideAlert();
  const isHidden = registerPanel.style.display === 'none';
  registerPanel.style.display = isHidden ? 'block' : 'none';
  linkRegister.textContent = isHidden ? 'Kembali ke login' : 'Daftar di sini';
});

btnLogin.addEventListener('click', async () => {
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();

  if (!username || !password) {
    return showAlert('Username dan password wajib diisi.');
  }

  btnLogin.disabled    = true;
  btnLogin.textContent = 'Memverifikasi...';

  try {
    const response = await fetch('/api/auth/login', {
      method  : 'POST',
      headers : { 'Content-Type': 'application/json' },
      body    : JSON.stringify({ username, password }),
    });

    const data = await response.json();

    if (data.success) {
      localStorage.setItem('token',    data.token);
      localStorage.setItem('username', data.user.username);
      localStorage.setItem('role',     data.user.role);
      localStorage.setItem('userId',   data.user.id);

      showAlert('Login berhasil! Mengalihkan...', 'success');

      setTimeout(() => {
        window.location.href = data.user.role === 'admin' ? '/views/admin.html' : '/views/user.html';
      }, 800);

    } else {
      showAlert(data.message || 'Login gagal. Periksa kembali kredensial Anda.');
    }

  } catch (networkErr) {
    showAlert('Tidak dapat terhubung ke server. Pastikan server berjalan.');
  } finally {
    btnLogin.disabled    = false;
    btnLogin.textContent = 'Masuk';
  }
});

document.getElementById('btnRegister').addEventListener('click', async () => {
  const email    = document.getElementById('regEmail').value.trim();
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value.trim();

  if (!email || !username || !password) {
    return showAlert('Semua field registrasi wajib diisi.');
  }

  try {
    const response = await fetch('/api/auth/register', {
      method  : 'POST',
      headers : { 'Content-Type': 'application/json' },
      body    : JSON.stringify({ email, username, password, role: 'user' }),
    });

    const data = await response.json();

    if (data.success) {
      showAlert('Permintaan pembuatan akun berhasil dikirim. Tunggu persetujuan admin.', 'success');
      registerPanel.style.display = 'none';
      linkRegister.textContent    = 'Daftar di sini';
      document.getElementById('regEmail').value = '';
      document.getElementById('regUsername').value = '';
      document.getElementById('regPassword').value = '';
    } else {
      showAlert(data.message || 'Registrasi gagal.');
    }

  } catch (e) {
    showAlert('Tidak dapat terhubung ke server.');
  }
});

passwordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') btnLogin.click();
});

// Theme Toggle Script
const themeToggle = document.getElementById('themeToggle');
function updateToggleIcon(theme) {
  const icon = themeToggle.querySelector('i');
  icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}
const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
updateToggleIcon(currentTheme);

themeToggle.addEventListener('click', () => {
  const activeTheme = document.documentElement.getAttribute('data-theme') || 'light';
  const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateToggleIcon(newTheme);
});
</script>
</body>
</html>
