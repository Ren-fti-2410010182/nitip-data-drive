<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Saya — Nitip Data Drive</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/user.css">
</head>
<body>

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="app-sidebar">
    <div class="app-brand">
      <span style="font-size: 1.5rem;">📦</span> Nitip Drive
    </div>
    
    <input type="file" id="fileInput" class="file-input-hidden">
    <button class="btn-upload-new" id="btnUploadTrigger" style="width: 100%; margin-bottom: 8px;">
      <span style="font-size: 1.25rem;">➕</span> Unggah File
    </button>
    <button class="btn-upload-new" id="btnCreateFolder" style="width: 100%; margin-bottom: 24px; background-color: var(--surface-variant);">
      <span style="font-size: 1.25rem;">📁</span> Buat Folder
    </button>
    
    <nav class="nav-menu">
      <div class="nav-item active" style="cursor: pointer;" onclick="navigateToFolder(null, 'Drive Saya')">
        <span>📂</span> Drive Saya
      </div>
    </nav>
    
    <div style="margin-top: auto; padding: 16px 0;">
      <button class="btn btn-secondary btn-block" id="btnLogout" style="justify-content: flex-start; padding-left: 24px;">
        🚪 Keluar
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="app-main">
    <header class="app-header">
      <div class="header-title">Drive Saya</div>
      <div class="header-actions">
        <span id="welcomeMsg" style="font-size: 0.875rem; color: var(--text-muted); font-weight: 500;"></span>
      </div>
    </header>

    <div class="app-content" id="dropZone">
      <div id="alert" class="alert"></div>

      <!-- Search Bar -->
      <div style="margin-bottom: 16px; display: flex; gap: 12px;">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 Cari file..." style="max-width: 300px; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-light); font-size: 0.9rem;">
      </div>

      <!-- Breadcrumbs Nav -->
      <div id="breadcrumb" class="breadcrumb"></div>

      <div id="fileContainer" style="height: 100%;">
        <div id="noFilesMsg" class="empty-state" style="display: none;">
          <div class="empty-state-icon">📭</div>
          <h3>Tempat untuk semua file Anda</h3>
          <p>Gunakan tombol "Baru" untuk mengunggah file.</p>
        </div>
        
        <div id="fileGrid" class="file-grid" style="display:none;"></div>
      </div>
    </div>
  </main>
</div>

<!-- Drag & Drop Overlay -->
<div id="dragOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(66, 133, 244, 0.9); z-index:9999; align-items:center; justify-content:center; color:white; font-size:2rem; font-weight:700; flex-direction:column; gap:16px;">
  <span>☁️</span>
  <span>Lepaskan file untuk mengunggah</span>
</div>

<!-- Upload Progress Overlay -->
<div id="uploadOverlay" class="upload-overlay">
  <div class="upload-overlay-header">
    Mengunggah <span id="uploadFileName">...</span>
  </div>
  <div class="upload-overlay-body">
    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted);">
      <span id="progressText">Memulai...</span>
    </div>
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>
</div>

<!-- View Modal Overlay -->
<div id="viewModal" class="view-modal-overlay" onclick="if(event.target===this) closeViewModal()">
  <div class="view-modal">
    <div class="view-modal-header">
      <div class="view-modal-title" id="viewModalTitle">Pratinjau File</div>
      <button class="view-modal-close" onclick="closeViewModal()">×</button>
    </div>
    <div class="view-modal-body" id="viewModalBody"></div>
  </div>
</div>

<!-- Create Folder Modal -->
<div id="createFolderModal" class="view-modal-overlay" onclick="if(event.target===this) closeCreateFolderModal()">
  <div class="view-modal" style="width: 400px; height: auto;">
    <div class="view-modal-header">
      <div class="view-modal-title">Buat Folder Baru</div>
      <button class="view-modal-close" onclick="closeCreateFolderModal()">×</button>
    </div>
    <div class="view-modal-form-body">
      <input type="text" id="folderNameInput" class="form-control" placeholder="Nama folder..." style="padding: 10px; border: 1px solid var(--border-light); border-radius: 4px; width: 100%; box-sizing: border-box;">
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn btn-secondary" onclick="closeCreateFolderModal()" style="padding: 8px 16px;">Batal</button>
        <button class="btn btn-primary" onclick="submitCreateFolder()" style="padding: 8px 16px;">Buat</button>
      </div>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div id="renameModal" class="view-modal-overlay" onclick="if(event.target===this) closeRenameModal()">
  <div class="view-modal" style="width: 400px; height: auto;">
    <div class="view-modal-header">
      <div class="view-modal-title">Ubah Nama</div>
      <button class="view-modal-close" onclick="closeRenameModal()">×</button>
    </div>
    <div class="view-modal-form-body">
      <input type="text" id="renameInput" class="form-control" placeholder="Nama baru..." style="padding: 10px; border: 1px solid var(--border-light); border-radius: 4px; width: 100%; box-sizing: border-box;">
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn btn-secondary" onclick="closeRenameModal()" style="padding: 8px 16px;">Batal</button>
        <button class="btn btn-primary" onclick="submitRename()" style="padding: 8px 16px;">Ubah</button>
      </div>
    </div>
  </div>
</div>

<!-- Custom Confirm Delete Modal -->
<div id="confirmDeleteModal" class="view-modal-overlay" onclick="if(event.target===this) closeConfirmDeleteModal()">
  <div class="view-modal" style="width: 450px; height: auto;">
    <div class="view-modal-header" style="background: var(--danger-bg); border-bottom: 1px solid #f2b8b5; padding: 16px 24px;">
      <div class="view-modal-title" style="color: var(--danger); font-weight: 700; display: flex; align-items: center; gap: 8px;">
        ⚠️ Konfirmasi Hapus
      </div>
      <button class="view-modal-close" onclick="closeConfirmDeleteModal()" style="color: var(--danger); font-size: 1.5rem; background: transparent; border: none; cursor: pointer;">×</button>
    </div>
    <div class="view-modal-form-body" style="text-align: left;">
      <p id="confirmDeleteMsg" style="font-size: 1rem; color: var(--text); margin-bottom: 0px; line-height: 1.5; font-weight: 500;"></p>
      <p id="confirmDeleteSubmsg" style="font-size: 0.875rem; color: var(--danger); font-weight: 500; margin-bottom: 0px; background: var(--danger-bg); padding: 12px; border-radius: var(--radius-sm); border-left: 4px solid var(--danger); line-height: 1.4;"></p>
      <div style="display: flex; gap: 12px; justify-content: flex-end; width: 100%;">
        <button class="btn btn-secondary" onclick="closeConfirmDeleteModal()" style="padding: 10px 20px;">Batal</button>
        <button id="btnConfirmDelete" class="btn btn-danger" style="padding: 10px 20px; background: var(--danger);">Hapus Permanen</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>

<script>
const token = localStorage.getItem('token');
const role  = localStorage.getItem('role');

if (!token) {
  window.location.href = '/views/login.html';
}

document.getElementById('welcomeMsg').textContent = `${localStorage.getItem('username')}`;

// State Management Folder
let currentFolderId = null;
let folderPath = [{ id: null, name: 'Drive Saya' }];

// Toast Notification System
function showToast(message, type = 'success') {
  const toastContainer = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  
  const icon = type === 'success' ? '✅' : '❌';
  toast.innerHTML = `
    <div class="toast-icon">${icon}</div>
    <div class="toast-content">${message}</div>
    <button class="toast-close">&times;</button>
  `;
  
  toastContainer.appendChild(toast);
  
  // Trigger transition
  setTimeout(() => toast.classList.add('show'), 50);
  
  const closeBtn = toast.querySelector('.toast-close');
  const dismissToast = () => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  };
  
  closeBtn.addEventListener('click', dismissToast);
  
  // Auto dismiss
  setTimeout(dismissToast, 4000);
}

// Redirect alert bawaan ke toast yang lebih indah
function showAlert(msg, type = 'error') {
  showToast(msg, type === 'error' ? 'error' : 'success');
}

function authHeader() {
  return { 'Authorization': `Bearer ${token}` };
}

/**
 * Memformat ukuran byte menjadi string yang mudah dibaca.
 * @param {number} bytes - Ukuran file dalam byte.
 * @returns {string} String format ukuran (KB, MB, GB).
 */
function formatSize(bytes) {
  if (bytes < 1024)           return `${bytes} B`;
  if (bytes < 1024 * 1024)    return `${(bytes / 1024).toFixed(1)} KB`;
  if (bytes < 1024 ** 3)      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
  return `${(bytes / 1024 ** 3).toFixed(2)} GB`;
}

/**
 * Mendapatkan ikon emoji berdasarkan MIME type file.
 * @param {string} mimeType - Tipe MIME file.
 * @returns {string} Karakter emoji ikon.
 */
function getFileIcon(mimeType) {
  if (mimeType.startsWith('image/')) return '🖼️';
  if (mimeType.includes('pdf')) return '📄';
  if (mimeType.includes('word') || mimeType.includes('document')) return '📝';
  if (mimeType.includes('sheet') || mimeType.includes('excel')) return '📊';
  if (mimeType.includes('zip') || mimeType.includes('rar') || mimeType.includes('7z')) return '📦';
  if (mimeType.includes('text') || mimeType.includes('plain')) return '📃';
  if (mimeType.includes('csv')) return '📈';
  return '📎';
}

function navigateToFolder(folderId, folderName) {
  const idx = folderPath.findIndex(item => item.id === folderId);
  if (idx !== -1) {
    folderPath = folderPath.slice(0, idx + 1);
  } else {
    folderPath.push({ id: folderId, name: folderName });
  }
  loadFiles(folderId);
}

function renderBreadcrumbs() {
  const breadcrumbEl = document.getElementById('breadcrumb');
  if (!breadcrumbEl) return;
  
  breadcrumbEl.innerHTML = '';
  
  folderPath.forEach((item, index) => {
    const isLast = index === folderPath.length - 1;
    
    const breadcrumbItem = document.createElement('span');
    breadcrumbItem.className = `breadcrumb-item ${isLast ? 'active' : ''}`;
    breadcrumbItem.textContent = item.name;
    
    if (!isLast) {
      breadcrumbItem.onclick = () => {
        navigateToFolder(item.id, item.name);
      };
      
      breadcrumbEl.appendChild(breadcrumbItem);
      
      const separator = document.createElement('span');
      separator.className = 'breadcrumb-separator';
      separator.textContent = '>';
      breadcrumbEl.appendChild(separator);
    } else {
      breadcrumbEl.appendChild(breadcrumbItem);
    }
  });
}

/**
 * Memuat semua file dan folder pengguna dan menampilkannya di Grid.
 * Juga menangani pengambilan thumbnail otomatis untuk gambar.
 */
async function loadFiles(parentFolderId = null) {
  currentFolderId = parentFolderId;
  renderBreadcrumbs();

  const fileGrid = document.getElementById('fileGrid');
  const noFilesMsg = document.getElementById('noFilesMsg');

  try {
    let url = '/api/files';
    if (parentFolderId) {
      url += `?parent_id=${parentFolderId}`;
    }
    
    const resp  = await fetch(url, { headers: authHeader() });
    const data  = await resp.json();

    if (!data.success || data.files.length === 0) {
      fileGrid.style.display = 'none';
      noFilesMsg.style.display = 'flex';
      noFilesMsg.querySelector('h3').textContent = 'Tempat untuk semua file Anda';
      noFilesMsg.querySelector('p').textContent = 'Gunakan tombol di sidebar untuk mengunggah file atau membuat folder.';
      return;
    }

    noFilesMsg.style.display = 'none';
    fileGrid.style.display = 'grid';
    fileGrid.innerHTML = '';

    data.files.forEach((file) => {
      const date = new Date(file.uploaded_at).toLocaleDateString('id-ID', {
        day: 'numeric', month: 'short', year: 'numeric'
      });

      let iconHTML, actionButtons;
      if (file.is_folder) {
        iconHTML = `<span class="file-icon" style="font-size: 2.5rem;">📁</span>`;
        actionButtons = `
          <button class="btn btn-primary btn-block" onclick="navigateToFolder(${file.id}, '${file.original_name.replace(/'/g, "\\'")}')" style="font-size: 0.75rem; padding: 6px;">📂 Buka</button>
          <div style="display: flex; gap: 4px;">
            <button class="btn btn-secondary btn-block" onclick="openRenameModal(${file.id}, '${file.original_name.replace(/'/g, "\\'")}')" style="font-size: 0.75rem; padding: 6px; flex: 1;">✏️ Ubah Nama</button>
            <button class="btn btn-danger btn-block" onclick="openConfirmDeleteModal(${file.id}, '${file.original_name.replace(/'/g, "\\'")}', true)" style="font-size: 0.75rem; padding: 6px; flex: 1;">🗑️ Hapus</button>
          </div>
        `;
      } else {
        const isImage = file.mime_type.startsWith('image/');
        iconHTML = isImage 
          ? `<div class="file-thumb" id="thumb-${file.id}" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:0.8rem;">Memuat...</div>`
          : `<span class="file-icon">${getFileIcon(file.mime_type)}</span>`;

        actionButtons = `
          <button class="btn btn-primary btn-block" onclick="viewFile(${file.id}, '${file.mime_type}', '${file.original_name.replace(/'/g, "\\'")}')" style="font-size: 0.75rem; padding: 6px;">👁 Lihat</button>
          <div style="display: flex; gap: 4px;">
            <button class="btn btn-secondary btn-block" onclick="downloadFile(${file.id}, '${file.original_name.replace(/'/g, "\\'")}')" style="font-size: 0.75rem; padding: 6px; flex: 1;">⬇ Unduh</button>
            <button class="btn btn-secondary btn-block" onclick="openRenameModal(${file.id}, '${file.original_name.replace(/'/g, "\\'")}')" style="font-size: 0.75rem; padding: 6px; flex: 1;">✏️</button>
            <button class="btn btn-danger btn-block" onclick="openConfirmDeleteModal(${file.id}, '${file.original_name.replace(/'/g, "\\'")}', false)" style="font-size: 0.75rem; padding: 6px;">🗑️</button>
          </div>
        `;
      }

      const fileCard = document.createElement('div');
      fileCard.className = 'file-card';
      fileCard.dataset.name = file.original_name.toLowerCase();
      fileCard.innerHTML = `
        <div class="file-card-top" style="overflow:hidden;">${iconHTML}</div>
        <div class="file-name" title="${file.original_name}">${file.original_name}</div>
        <div class="file-meta">${file.is_folder ? 'Folder' : formatSize(file.file_size)} • ${date}</div>
        <div class="file-card-actions">
          ${actionButtons}
        </div>
      `;
      fileGrid.appendChild(fileCard);

      // Async fetch untuk thumbnail gambar agar preview langsung terlihat
      if (!file.is_folder && file.mime_type.startsWith('image/')) {
        fetch(`/api/files/download?id=${file.id}`, { headers: authHeader() })
          .then(r => r.blob())
          .then(blob => {
            const url = URL.createObjectURL(blob);
            document.getElementById(`thumb-${file.id}`).innerHTML = `<img src="${url}" style="width:100%; height:100%; object-fit:cover; display:block;">`;
          })
          .catch(() => {
            document.getElementById(`thumb-${file.id}`).innerHTML = `<span class="file-icon">🖼️</span>`;
          });
      }
    });

    // Panggil filter ulang jika ada teks di pencarian saat direload
    filterFiles();

  } catch (e) {
    console.error('Error loading files:', e);
    noFilesMsg.innerHTML = '<div class="empty-state-icon">❌</div><h3>Gagal memuat file</h3>';
    noFilesMsg.style.display = 'flex';
    fileGrid.style.display = 'none';
  }
}

// ── FITUR PENCARIAN / FILTER ──
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', filterFiles);

/**
 * Menyaring tampilan kartu file berdasarkan input teks.
 */
function filterFiles() {
  const query = searchInput.value.toLowerCase();
  const cards = document.querySelectorAll('.file-card');
  let visibleCount = 0;
  cards.forEach(card => {
    if (card.dataset.name.includes(query)) {
      card.style.display = 'flex';
      visibleCount++;
    } else {
      card.style.display = 'none';
    }
  });
  
  const noFilesMsg = document.getElementById('noFilesMsg');
  if (visibleCount === 0 && cards.length > 0) {
    noFilesMsg.style.display = 'flex';
    noFilesMsg.querySelector('h3').textContent = 'File tidak ditemukan';
    noFilesMsg.querySelector('p').textContent = `Tidak ada file yang cocok dengan "${query}"`;
  } else if (cards.length > 0) {
    noFilesMsg.style.display = 'none';
  }
}

// ── FUNGSI DOWNLOAD & VIEW ──
/**
 * Mengunduh file dengan ID yang diberikan ke perangkat lokal.
 * @param {number} fileId - ID file dari database.
 * @param {string} originalName - Nama file asli untuk fallback download name.
 */
async function downloadFile(fileId, originalName) {
  try {
    const resp = await fetch(`/api/files/download?id=${fileId}`, {
      headers: authHeader(),
    });

    if (!resp.ok) {
      const err = await resp.json();
      return showAlert(err.message || 'Gagal mengunduh file.');
    }

    const disposition = resp.headers.get('Content-Disposition');
    let fileName = originalName || 'download';
    if (disposition) {
      const match = disposition.match(/filename="?([^"]+)"?/);
      if (match) fileName = decodeURIComponent(match[1]);
    }

    const blob    = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);

    const link    = document.createElement('a');
    link.href     = blobUrl;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

  } catch (e) {
    showAlert('Terjadi kesalahan saat mengunduh file.');
  }
}

/**
 * Membuka file secara langsung di dalam modal (Preview).
 * @param {number} fileId - ID file.
 * @param {string} mimeType - Tipe MIME file untuk menentukan cara menampilkannya.
 * @param {string} fileName - Nama file.
 */
async function viewFile(fileId, mimeType, fileName) {
  const modal = document.getElementById('viewModal');
  const modalTitle = document.getElementById('viewModalTitle');
  const modalBody = document.getElementById('viewModalBody');
  
  modalTitle.textContent = 'Memuat...';
  modalBody.innerHTML = '<div style="color:var(--text-muted)">Memuat pratinjau...</div>';
  modal.classList.add('show');
  
  try {
    const resp = await fetch(`/api/files/download?id=${fileId}`, { headers: authHeader() });
    if (!resp.ok) {
      modalBody.innerHTML = '<div style="color:var(--danger)">Gagal memuat file.</div>';
      return;
    }
    
    modalTitle.textContent = fileName;
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    
    if (mimeType.startsWith('image/')) {
      modalBody.innerHTML = `<img src="${url}" class="view-modal-content" style="object-fit:contain;">`;
    } else if (mimeType === 'application/pdf') {
      modalBody.innerHTML = `<iframe src="${url}" class="view-modal-content" style="width:100%; height:100%; border:none;"></iframe>`;
    } else if (mimeType.startsWith('text/') || mimeType.includes('csv') || mimeType === 'application/json') {
      const text = await blob.text();
      modalBody.innerHTML = `<div class="view-modal-text">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
    } else {
      modalBody.innerHTML = `<div style="text-align:center; color:var(--text-muted)">
        <div style="font-size:3rem; margin-bottom:16px;">📄</div>
        Pratinjau tidak tersedia untuk tipe file ini.<br><br>
        <button class="btn btn-primary" style="margin-top: 16px;" onclick="downloadFile(${fileId}, '${fileName.replace(/'/g, "\\'")}')">Unduh File</button>
      </div>`;
    }
    
  } catch (e) {
    modalBody.innerHTML = '<div style="color:var(--danger)">Terjadi kesalahan.</div>';
  }
}

function closeViewModal() {
  document.getElementById('viewModal').classList.remove('show');
  document.getElementById('viewModalBody').innerHTML = ''; // Kosongkan untuk menghindari memory leak objek URL
}

// ── UPLOAD FILE ──
const fileInput   = document.getElementById('fileInput');
const btnUploadTrigger = document.getElementById('btnUploadTrigger');
const btnCreateFolder = document.getElementById('btnCreateFolder');
const uploadOverlay = document.getElementById('uploadOverlay');
const uploadFileName = document.getElementById('uploadFileName');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');

btnUploadTrigger.addEventListener('click', () => fileInput.click());
btnCreateFolder.addEventListener('click', () => openCreateFolderModal());

fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    const file = fileInput.files[0];
    uploadFile(file);
  }
});

/**
 * Memproses unggahan file menggunakan XMLHttpRequest agar bisa memantau proses _upload_ (progress bar).
 * @param {File} file - Objek file native dari browser.
 */
function uploadFile(file) {
  const formData = new FormData();
  formData.append('file', file);

  uploadOverlay.style.display = 'block';
  uploadFileName.textContent = file.name;
  progressBar.style.width = '0%';
  progressText.textContent = 'Memulai...';

  const xhr = new XMLHttpRequest();

  xhr.upload.addEventListener('progress', (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progressBar.style.width = pct + '%';
      progressText.textContent = `${pct}% selesai`;
    }
  });

  xhr.addEventListener('load', () => {
    const data = JSON.parse(xhr.responseText);
    
    setTimeout(() => { uploadOverlay.style.display = 'none'; }, 2000);

    if (data.success) {
      progressText.textContent = 'Berhasil diunggah!';
      progressBar.style.background = 'var(--success)';
      fileInput.value = '';
      showToast('File berhasil diunggah.', 'success');
      loadFiles(currentFolderId); 
    } else {
      progressText.textContent = 'Upload gagal.';
      progressBar.style.background = 'var(--danger)';
      showAlert(data.message || 'Upload gagal.');
    }
  });

  xhr.addEventListener('error', () => {
    progressText.textContent = 'Koneksi terputus.';
    progressBar.style.background = 'var(--danger)';
    setTimeout(() => { uploadOverlay.style.display = 'none'; }, 3000);
    showAlert('Koneksi terputus saat mengunggah.');
  });

  let uploadUrl = '/api/files/upload';
  if (currentFolderId !== null) {
    uploadUrl += `?parent_id=${currentFolderId}`;
  }

  xhr.open('POST', uploadUrl);
  xhr.setRequestHeader('Authorization', `Bearer ${token}`);
  xhr.send(formData);
}

// ── DRAG AND DROP FEATURE ──
const dragOverlay = document.getElementById('dragOverlay');

// Menangani kejadian drag masuk dan keluar dari jendela browser
window.addEventListener('dragover', (e) => {
  e.preventDefault();
  dragOverlay.style.display = 'flex';
});

window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  // Hanya sembunyikan jika pointer benar-benar keluar dari jendela
  if (e.relatedTarget === null || e.clientX === 0 || e.clientY === 0) {
    dragOverlay.style.display = 'none';
  }
});

window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragOverlay.style.display = 'none';
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    // Unggah file pertama yang dijatuhkan (saat ini mendukung 1 file per unggahan di sistem)
    uploadFile(e.dataTransfer.files[0]);
  }
});

// ── LOGOUT ──
document.getElementById('btnLogout').addEventListener('click', async () => {
  await fetch('/api/auth/logout', {
    method  : 'POST',
    headers : authHeader(),
  });
  localStorage.clear();
  window.location.href = '/views/login.html';
});

// ── CREATE FOLDER ──
function openCreateFolderModal() {
  document.getElementById('createFolderModal').classList.add('show');
  document.getElementById('folderNameInput').focus();
}

function closeCreateFolderModal() {
  document.getElementById('createFolderModal').classList.remove('show');
  document.getElementById('folderNameInput').value = '';
}

async function submitCreateFolder() {
  const folderName = document.getElementById('folderNameInput').value.trim();
  if (!folderName) {
    showAlert('Nama folder tidak boleh kosong.');
    return;
  }

  try {
    const resp = await fetch('/api/files/folder', {
      method: 'POST',
      headers: {
        ...authHeader(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        folderName: folderName,
        parentFolderId: currentFolderId
      })
    });

    const data = await resp.json();
    if (data.success) {
      showToast('Folder berhasil dibuat.', 'success');
      closeCreateFolderModal();
      loadFiles(currentFolderId);
    } else {
      showAlert(data.message || 'Gagal membuat folder.');
    }
  } catch (e) {
    console.error('Error:', e);
    showAlert('Terjadi kesalahan saat membuat folder.');
  }
}

// ── RENAME ITEM ──
let renameItemId = null;

function openRenameModal(itemId, currentName) {
  renameItemId = itemId;
  document.getElementById('renameInput').value = currentName;
  document.getElementById('renameModal').classList.add('show');
  document.getElementById('renameInput').focus();
  document.getElementById('renameInput').select();
}

function closeRenameModal() {
  document.getElementById('renameModal').classList.remove('show');
  document.getElementById('renameInput').value = '';
  renameItemId = null;
}

async function submitRename() {
  const newName = document.getElementById('renameInput').value.trim();
  if (!newName) {
    showAlert('Nama tidak boleh kosong.');
    return;
  }

  if (!renameItemId) {
    showAlert('Item tidak valid.');
    return;
  }

  try {
    const resp = await fetch('/api/files/rename', {
      method: 'PUT',
      headers: {
        ...authHeader(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        id: renameItemId,
        newName: newName
      })
    });

    const data = await resp.json();
    if (data.success) {
      showToast('Nama berhasil diubah.', 'success');
      closeRenameModal();
      loadFiles(currentFolderId);
    } else {
      showAlert(data.message || 'Gagal mengubah nama.');
    }
  } catch (e) {
    console.error('Error:', e);
    showAlert('Terjadi kesalahan saat mengubah nama.');
  }
}

// ── CUSTOM CONFIRM DELETE MODAL & ACTIONS ──
let deleteItemId = null;

function openConfirmDeleteModal(itemId, itemName, isFolder = false) {
  deleteItemId = itemId;
  
  const msgEl = document.getElementById('confirmDeleteMsg');
  const submsgEl = document.getElementById('confirmDeleteSubmsg');
  
  if (isFolder) {
    msgEl.innerHTML = `Apakah Anda yakin ingin menghapus folder <strong>"${itemName}"</strong>?`;
    submsgEl.style.display = 'block';
    submsgEl.textContent = '⚠️ Peringatan: Menghapus folder ini akan menghapus semua file dan subfolder di dalamnya secara permanen.';
  } else {
    msgEl.innerHTML = `Apakah Anda yakin ingin menghapus file <strong>"${itemName}"</strong>?`;
    submsgEl.style.display = 'none';
  }
  
  const modal = document.getElementById('confirmDeleteModal');
  modal.classList.add('show');
}

function closeConfirmDeleteModal() {
  document.getElementById('confirmDeleteModal').classList.remove('show');
  deleteItemId = null;
}

document.getElementById('btnConfirmDelete').onclick = async function() {
  if (!deleteItemId) return;
  
  try {
    const resp = await fetch(`/api/files?id=${deleteItemId}`, {
      method: 'DELETE',
      headers: authHeader()
    });

    const data = await resp.json();
    if (data.success) {
      showToast('Item berhasil dihapus.', 'success');
      closeConfirmDeleteModal();
      loadFiles(currentFolderId);
    } else {
      showToast(data.message || 'Gagal menghapus item.', 'error');
    }
  } catch (e) {
    console.error('Error:', e);
    showToast('Terjadi kesalahan saat menghapus item.', 'error');
  }
};

// Pengecekan Status Akun Berkala
async function checkAccountStatus() {
  if (!token) return;
  try {
    const resp = await fetch('/api/auth/status', { headers: authHeader() });
    if (resp.status === 401 || resp.status === 403) {
      const data = await resp.json();
      if (data.status === 'disabled' || (data.message && data.message.includes('nonaktif'))) {
        handleAccountDeactivated();
      }
    }
  } catch (e) {
    console.error('Error checking status:', e);
  }
}

function handleAccountDeactivated() {
  document.body.innerHTML = `
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--background); color: var(--text); font-family: 'Outfit', sans-serif; padding: 24px; text-align: center;">
      <div style="font-size: 5rem; margin-bottom: 24px; animation: bounce 2s infinite;">🔒</div>
      <h1 style="color: var(--danger); font-size: 2rem; font-weight: 700; margin-bottom: 12px;">Akun Dinonaktifkan</h1>
      <p style="font-size: 1.1rem; color: var(--text-muted); max-width: 500px; line-height: 1.6; margin-bottom: 32px;">
        Maaf, akun Anda telah dinonaktifkan oleh administrator. Anda tidak lagi memiliki akses ke berkas di Nitip Data Drive.
      </p>
      <div style="font-size: 0.875rem; color: var(--text-muted); background: var(--surface-variant); padding: 8px 16px; border-radius: var(--radius-sm);">
        Mengarahkan kembali ke halaman login dalam beberapa detik...
      </div>
    </div>
  `;
  
  localStorage.clear();
  setTimeout(() => {
    window.location.href = '/views/login.html';
  }, 5000);
}

// Jalankan pengecekan setiap 10 detik dan jalankan langsung di awal
setInterval(checkAccountStatus, 10000);
checkAccountStatus();

loadFiles();
</script>
